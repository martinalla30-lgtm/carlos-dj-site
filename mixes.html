<style>
  :root {
    color-scheme: dark;
    --bg: #0D0D0D;
    --violet: #8B5CF6;
    --pink: #EC4899;
    --text: #F7F4FB;
    --muted: #BDB6CB;
    --line: rgba(255, 255, 255, .14);
    --gutter: clamp(16px, 4vw, 48px);
    --edge: max(var(--gutter), calc((100vw - 1200px) / 2));
    --display: "Anton", Impact, "Arial Narrow", sans-serif;
    --label: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 1.0625rem/1.55 var(--body);
    overflow-x: clip;
  }
  h1 { margin: 0; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 4px; }

  /* Animated gradient (same as the home page) */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
  .aurora i {
    position: absolute;
    width: 95vmax;
    height: 95vmax;
    border-radius: 50%;
    will-change: transform;
  }
  .aurora i:nth-child(1) {
    top: -45vmax;
    left: -30vmax;
    background: radial-gradient(closest-side, rgba(139, 92, 246, .62), transparent);
    animation: drift-a 19s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(2) {
    right: -35vmax;
    bottom: -50vmax;
    background: radial-gradient(closest-side, rgba(236, 72, 153, .5), transparent);
    animation: drift-b 23s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(3) {
    top: 15%;
    left: 30%;
    width: 60vmax;
    height: 60vmax;
    background: radial-gradient(closest-side, rgba(236, 72, 153, .24), transparent);
    animation: drift-c 29s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate(38vw, 28vh) scale(1.15); } }
  @keyframes drift-b { to { transform: translate(-42vw, -32vh) scale(1.2); } }
  @keyframes drift-c { to { transform: translate(-40vw, 20vh) scale(.8); } }

  /* Navigation (same as the home page) */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13, 13, 13, .62);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 60px;
    padding-inline: var(--edge);
  }
  .brand {
    font: 400 1.3rem/1 var(--display);
    letter-spacing: .03em;
    text-decoration: none;
    white-space: nowrap;
    text-shadow: 0 0 14px var(--pink);
    color: inherit;
  }
  .nav ul { display: flex; gap: clamp(2px, 2vw, 20px); margin: 0; padding: 0; list-style: none; }
  .nav li a {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding-inline: 10px;
    font: 600 1.05rem/1 var(--label);
    letter-spacing: .1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    box-shadow: inset 0 -2px 0 transparent;
    transition: color .2s, box-shadow .2s;
  }
  .nav li a:hover, .nav li a[aria-current] {
    color: #fff;
    box-shadow: inset 0 -2px 0 var(--pink);
  }

  /* Page */
  main { padding: clamp(24px, 4vh, 40px) var(--edge) clamp(40px, 7vh, 72px); }
  h1 {
    margin-bottom: clamp(16px, 3vh, 26px);
    font: 400 clamp(2.75rem, 7vw, 4.5rem)/1.05 var(--display);
    letter-spacing: .012em;
    text-transform: uppercase;
    color: #FFF6FC;
    text-shadow: 0 0 .02em #fff, 0 0 .1em var(--pink), 0 0 .28em var(--pink), 0 0 .6em var(--violet);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
